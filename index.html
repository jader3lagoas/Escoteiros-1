<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Gerador de Certificados QAPDMR</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 15px; font-family: Arial, sans-serif; background: #eeeeee; }
h1 { text-align: center; font-size: 22px; margin: 5px 0 15px 0; }
#controles { width: 100%; max-width: 1000px; margin: 0 auto 15px auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.campo { margin-bottom: 10px; }
.campo label { display: block; font-weight: bold; margin-bottom: 4px; }
.campo input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #aaa; border-radius: 6px; }
.linha { display: flex; gap: 10px; }
.linha .campo { flex: 1; }
#cor { height: 45px; padding: 3px; }
#botao { width: 100%; padding: 13px; margin-top: 5px; font-size: 17px; font-weight: bold; color: white; background: #1976d2; border: none; border-radius: 7px; cursor: pointer; }
#botao:hover { background: #125da7; }
#botaoVerificar { width: 100%; padding: 12px; margin-top: 5px; font-size: 16px; font-weight: bold; color: white; background: #2e7d32; border: none; border-radius: 7px; cursor: pointer; }
#msgVerificacao { margin-top: 10px; text-align: center; font-weight: bold; min-height: 22px; }
#certificado { position: relative; width: 100%; max-width: 1000px; margin: 0 auto; aspect-ratio: 1000 / 707; background-image: url("certificado.jpg"); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; background-color: white; overflow: hidden; touch-action: pinch-zoom; }
#identificacao { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: bold; white-space: nowrap; line-height: 1; user-select: none; -webkit-user-select: none; cursor: grab; touch-action: pinch-zoom; }
#identificacao:active { cursor: grabbing; }
#rodape { position: absolute; right: 2%; bottom: 2%; font-weight: bold; white-space: nowrap; text-align: right; line-height: 1.1; user-select: none; -webkit-user-select: none; }
@media (max-width: 600px) { body { padding: 8px; } h1 { font-size: 19px; } #controles { padding: 10px; } .linha { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
<h1>Gerador de Certificados</h1>
<div id="controles">
    <div class="campo"><label for="nome">Nome:</label><input type="text" id="nome" placeholder="Digite o nome"></div>
    <div class="campo"><label for="indicativo">Indicativo:</label><input type="text" id="indicativo" placeholder="Digite o indicativo"></div>
    <button id="botaoVerificar" onclick="verificarParticipacao()">VERIFICAR PARTICIPAÇÃO NA RODADA</button>
    <div id="msgVerificacao"></div>
    <div class="linha">
        <div class="campo"><label for="cor">Cor:</label><input type="color" id="cor" value="#000000"></div>
        <div class="campo"><label for="tamanho">Tamanho:</label><input type="number" id="tamanho" value="52" min="10" max="150"></div>
    </div>
    <button id="botao" onclick="baixarCertificado()">BAIXAR CERTIFICADO</button>
</div>
<div id="certificado"><div id="identificacao"></div><div id="rodape"></div></div>
<script>
const URL_ROBO = "https://script.google.com/macros/s/AKfycbz09XIJzpbaLPYlsHXuzrEv5juOLf8w1YSprw220bEUIrg2Zq8N0HAIoQOlEyODuylfgg/exec";
let liberado = false;
const nomeInput = document.getElementById("nome");
const indicativoInput = document.getElementById("indicativo");
const msgVerificacao = document.getElementById("msgVerificacao");
const corInput = document.getElementById("cor");
const tamanhoInput = document.getElementById("tamanho");
const identificacao = document.getElementById("identificacao");
const rodape = document.getElementById("rodape");
const certificado = document.getElementById("certificado");
let posicaoX = 500;
let posicaoY = 353.5;
function dataAtual() { const hoje = new Date(); const dia = String(hoje.getDate()).padStart(2, "0"); const mes = String(hoje.getMonth() + 1).padStart(2, "0"); const ano = hoje.getFullYear(); return dia + "/" + mes + "/" + ano; }
function atualizar() {
    indicativoInput.value = indicativoInput.value.toUpperCase();
    const nome = nomeInput.value.trim();
    const indicativo = indicativoInput.value.trim();
    const cor = corInput.value;
    const tamanho = Number(tamanhoInput.value) || 52;
    identificacao.style.color = cor;
    rodape.style.color = cor;
    const largura = certificado.clientWidth;
    const escala = largura / 1000;
    identificacao.style.fontSize = (tamanho * escala) + "px";
    if (indicativo) { identificacao.textContent = indicativo; }
    else if (nome) { identificacao.textContent = nome; }
    else { identificacao.textContent = ""; }
    if (nome && indicativo) { rodape.textContent = nome + " — Emitido em " + dataAtual(); rodape.style.fontSize = (tamanho * escala * 0.17) + "px"; }
    else { rodape.textContent = "Emitido em " + dataAtual(); rodape.style.fontSize = (tamanho * escala * 0.28) + "px"; }
    posicionarTexto();
}
function posicionarTexto() {
    const largura = certificado.clientWidth;
    const altura = certificado.clientHeight;
    const escala = largura / 1000;
    identificacao.style.left = (posicaoX * escala) + "px";
    identificacao.style.top = (posicaoY * escala) + "px";
}
let arrastando = false;
let inicioX = 0; let inicioY = 0; let inicioPosicaoX = 0; let inicioPosicaoY = 0;
identificacao.addEventListener("pointerdown", function(event) { arrastando = true; identificacao.setPointerCapture(event.pointerId); inicioX = event.clientX; inicioY = event.clientY; inicioPosicaoX = posicaoX; inicioPosicaoY = posicaoY; });
identificacao.addEventListener("pointermove", function(event) {
    if (!arrastando) return;
    const largura = certificado.clientWidth; const altura = certificado.clientHeight;
    const escalaX = 1000 / largura; const escalaY = 707 / altura;
    const deslocamentoX = (event.clientX - inicioX) * escalaX;
    const deslocamentoY = (event.clientY - inicioY) * escalaY;
    posicaoX = inicioPosicaoX + deslocamentoX; posicaoY = inicioPosicaoY + deslocamentoY;
    posicaoX = Math.max(0, Math.min(1000, posicaoX)); posicaoY = Math.max(0, Math.min(707, posicaoY));
    posicionarTexto();
});
identificacao.addEventListener("pointerup", function() { arrastando = false; });
identificacao.addEventListener("pointercancel", function() { arrastando = false; });
nomeInput.addEventListener("input", atualizar);
indicativoInput.addEventListener("input", atualizar);
corInput.addEventListener("input", atualizar);
tamanhoInput.addEventListener("input", atualizar);
window.addEventListener("resize", atualizar);
async function verificarParticipacao() {
    const indicativo = indicativoInput.value.trim().toUpperCase();
    if (!indicativo) { msgVerificacao.style.color = "red"; msgVerificacao.textContent = "⚠️ Preencha seu Indicativo primeiro."; return false; }
    msgVerificacao.style.color = "#333";
    msgVerificacao.textContent = "Verificando... aguarde...";
    try {
        const resp = await fetch(URL_ROBO + "?indicativo=" + encodeURIComponent(indicativo));
        const dados = await resp.json();
        if (!dados.ok) { liberado = false; msgVerificacao.style.color = "red"; msgVerificacao.textContent = "❌ " + dados.erro; return false; }
        liberado = true; msgVerificacao.style.color = "green"; msgVerificacao.textContent = "✅ Liberado! Você participou da rodada. Agora pode baixar."; return true;
    } catch (e) { liberado = false; msgVerificacao.style.color = "red"; msgVerificacao.textContent = "❌ Erro ao conectar no robô. Tente de novo em 1 minuto."; return false; }
}
async function baixarCertificado() {
    if (!liberado) { const ok = await verificarParticipacao(); if (!ok) return; }
    const nome = nomeInput.value.trim();
    const indicativo = indicativoInput.value.trim().toUpperCase();
    const cor = corInput.value;
    const tamanho = Number(tamanhoInput.value) || 52;
    const canvas = document.createElement("canvas");
    canvas.width = 1000; canvas.height = 707;
    const ctx = canvas.getContext("2d");
    const fundo = new Image();
    fundo.onload = function() {
        ctx.drawImage(fundo, 0, 0, 1000, 707);
        ctx.fillStyle = cor;
        ctx.font = "bold " + tamanho + "px Arial";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        let textoPrincipal = "";
        if (indicativo) { textoPrincipal = indicativo; }
        else if (nome) { textoPrincipal = nome; }
        if (textoPrincipal) { ctx.fillText(textoPrincipal, posicaoX, posicaoY); }
        ctx.textAlign = "right"; ctx.textBaseline = "bottom";
        const textoRodape = nome ? nome + " — Emitido em " + dataAtual() : "Emitido em " + dataAtual();
        const tamanhoRodape = (nome && indicativo) ? Math.max(12, tamanho * 0.17) : Math.max(14, tamanho * 0.28);
        ctx.font = "bold " + tamanhoRodape + "px Arial";
        ctx.fillText(textoRodape, 980, 687);
        const link = document.createElement("a");
        link.download = "certificado.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    };
    fundo.src = "certificado.jpg";
}
atualizar();
</script>
</body>
</html>
