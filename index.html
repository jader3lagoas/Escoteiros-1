
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado - Rodada TG 72429</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:30px;background:#f2f2f2}
.box{background:#fff;max-width:400px;margin:auto;padding:25px;border-radius:12px;box-shadow:0 0 10px #ccc}
input{width:90%;padding:12px;font-size:18px;text-align:center;text-transform:uppercase;margin:10px 0}
button{width:95%;padding:12px;font-size:18px;background:#1a73e8;color:#fff;border:0;border-radius:8px;cursor:pointer}
#msg{margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>📻 Certificado - Rodada TG 72429</h2>
<p>Quinta-feira 21:30 às 22:30</p>
<input id="indicativo" placeholder="SEU INDICATIVO ex: PU1ABC">
<button onclick="verificar()">Verificar e Gerar Certificado</button>
<div id="msg"></div>
</div>

<script>
const URL_ROBO = "https://script.google.com/macros/s/AKfycbwb9AYyr7lA6srgjZYl2BnrZV7VlpBqAP1nXDXtjWkeRfltAFIWC1-5N_DnEE9vfjiDpg/exec";

function verificar(){
  const ind = document.getElementById("indicativo").value.trim().toUpperCase();
  const msg = document.getElementById("msg");
  if(!ind){ msg.innerText = "Digite seu indicativo!"; return; }
  msg.innerText = "Verificando...";
  const s = document.createElement("script");
  s.src = URL_ROBO + "?indicativo=" + encodeURIComponent(ind) + "&callback=retorno&x=" + Date.now();
  document.body.appendChild(s);
}
function retorno(dados){
  const msg = document.getElementById("msg");
  if(!dados.ok){ msg.style.color="red"; msg.innerText = dados.erro; return; }
  msg.style.color="green";
  msg.innerText = "✅ Liberado! Você participou da rodada!";
  alert("Liberado! Agora pode gerar seu certificado.");
}
</script>
</body>
</html>
